version: '3.7'

services:
  dynfrs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dynfrs-privacy-service
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./Datasets:/app/Datasets:ro
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  models:
    driver: local
  results:
    driver: local
